services:
  yt-dlp:
    build: .
    image: local-yt-dlp
    container_name: yt-dlp-reddit
    volumes:
      - /path/to/youtube_cookies.txt:/cookies/youtube_cookies.txt:rw
      - .:/downloads
    environment:
      DOWNLOAD_DIR: /downloads
      STATE_DIR: /downloads/.yt-dlp
    command: ["/usr/local/bin/download_playlist.sh"]
